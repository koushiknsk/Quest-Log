<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logo Preview</title>
  <style>
    body {
      background-color: #0F0F0F;
      color: #E0E0E0;
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .logo-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    svg {
      width: 250px;
      height: 250px;
      border-radius: 40px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.8);
    }
    h3 { margin: 0; font-size: 24px; font-weight: 500; }
  </style>
</head>
<body>

  <div class="logo-container">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
      <rect width="100" height="100" fill="#090a0f"/>
      <path d="M 54.35 74.6 A 25 25 0 1 1 74.6 54.35" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="butt"/>
      <circle cx="67.7" cy="67.7" r="7" fill="#ffb800"/>
    </svg>
    <h3>Final Quest Log Logo</h3>
  </div>

</body>
</html>
